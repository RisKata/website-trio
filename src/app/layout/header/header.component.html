<ng-template #navBar let-showLogo="showLogo">
  <div class="container header-inner">
    @if (showLogo) {
      <a routerLink="/" class="logo" (click)="closeMenu()">
        <img src="logo.png" alt="Trio 95" class="logo-img" />
      </a>
    }

    <nav class="nav" [class.nav-open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">{{ 'nav.home' | t }}</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">{{ 'nav.about' | t }}</a>
      <a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">{{ 'nav.products' | t }}</a>
      <a routerLink="/horeca" routerLinkActive="active" (click)="closeMenu()">{{ 'nav.horeca' | t }}</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-cta" (click)="closeMenu()">{{ 'nav.contact' | t }}</a>
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="a11y-toggle"
        [class.active]="a11y.mono()"
        [attr.aria-pressed]="a11y.mono()"
        [attr.aria-label]="a11yLabel() | t"
        (click)="a11y.toggle()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="7.2" r="1.35" fill="currentColor" />
          <path d="M12 9.2v5.2M9.2 11.1h5.6M9.6 18.2l2.4-3.8 2.4 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <app-language-switcher />

      <button
        class="menu-toggle"
        type="button"
        [class.open]="menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</ng-template>

<header
  #mainHeader
  class="header header-main"
  [attr.inert]="scrolled ? '' : null"
  [attr.aria-hidden]="scrolled ? true : null"
>
  <ng-container *ngTemplateOutlet="navBar; context: { showLogo: true }" />
</header>

<header
  class="header header-dock"
  [class.visible]="scrolled"
  [attr.inert]="scrolled ? null : ''"
  [attr.aria-hidden]="scrolled ? null : true"
>
  <ng-container *ngTemplateOutlet="navBar; context: { showLogo: false }" />
</header>
