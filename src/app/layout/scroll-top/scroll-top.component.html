@if (visible()) {
  <button
    type="button"
    class="scroll-top"
    [class.scroll-top--raised]="consent.bannerOpen()"
    [attr.aria-label]="'scroll.top' | t"
    (click)="scrollToTop()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 6.2 5.2 13l1.4 1.4L11 9.9V18h2V9.9l4.4 4.5 1.4-1.4z" />
    </svg>
  </button>
}
