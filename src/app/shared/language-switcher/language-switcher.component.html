<div class="lang-switcher">
  <button
    type="button"
    class="lang-trigger"
    [attr.aria-expanded]="open"
    aria-haspopup="listbox"
    [attr.aria-label]="'lang.label' | t"
    [attr.title]="currentNameKey | t"
    (click)="toggle($event)"
  >
    {{ currentLabel }}
    <svg class="chevron" viewBox="0 0 12 8" aria-hidden="true">
      <path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (open) {
    <ul class="lang-menu" role="listbox" [attr.aria-label]="'lang.label' | t">
      @for (lang of languages; track lang.code) {
        <li>
          <button
            type="button"
            class="lang-option"
            role="option"
            [class.active]="currentLang() === lang.code"
            [attr.aria-selected]="currentLang() === lang.code"
            [attr.title]="lang.nameKey | t"
            (click)="select(lang.code)"
          >
            {{ lang.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
